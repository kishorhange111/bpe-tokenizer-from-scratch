[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bpe-tokenizer-from-scratch"
version = "0.1.0"
description = "Byte-level BPE from scratch: GPT-2/cl100k pre-tokenization, naive vs incremental heap trainer (identical merges), O(n log n) heap encoder, exact GPT-2 compatibility with tiktoken, CPU benchmarks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kishor Hange" }]
dependencies = ["regex>=2023.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "tiktoken>=0.7"]
bench = ["tiktoken>=0.7", "tokenizers>=0.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741", "E731"]
